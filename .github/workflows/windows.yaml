name: Windows library tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', 'stable']
    env:
      CGO_ENABLED: '1'
      ETW_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit and native ETW integration tests with race detector
        run: go test -race -count=1 -timeout=5m ./...

  build:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', 'stable']
        arch: ['amd64', 'arm64', '386']
    env:
      CGO_ENABLED: '0'
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build library and all examples
        run: go build ./...
